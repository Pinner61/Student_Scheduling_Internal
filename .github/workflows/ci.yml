name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_DEMO_MODE: "true"
      ENABLE_DEMO_AUTH: "true"
      NEXT_PUBLIC_ENABLE_DEMO_AUTH: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
